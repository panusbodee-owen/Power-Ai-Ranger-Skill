<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>AI Team Studio</title>
<style>
:root{color-scheme:light;
--bg:#f2f2f7;--sb:#e9e9ee;--p:#ffffff;--p2:#f2f2f7;--ln:#d9d9de;--ln2:#c4c4ca;--tx:#1d1d1f;--mu:#6e6e73;
--bl:#007aff;--ac:#007aff;--act:#0062cc;--acs:rgba(0,122,255,.12);
--gr:#248a3d;--or:#c93400;--rd:#d70015;--cy:#0a7ea4;--pk:#8944ab;--vi:#8944ab;
--on:#ffffff;--onac:#fff;--hair:rgba(60,60,67,.08);--shadow:0 0 0 .5px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.05);--scrim:rgba(242,242,247,.8);
--metal:none;--vig:none;--tick:#c4c4ca;--seg:rgba(118,118,128,.12);--segon:#fff;--segsh:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
:root[data-theme=dark]{color-scheme:dark;
--bg:#1c1c1e;--sb:#242426;--p:#2c2c2e;--p2:#3a3a3c;--ln:#3d3d40;--ln2:#545458;--tx:#f5f5f7;--mu:#a1a1a6;
--bl:#0a84ff;--ac:#0a84ff;--act:#64acff;--acs:rgba(10,132,255,.2);
--gr:#32d74b;--or:#ff9f0a;--rd:#ff453a;--cy:#64d2ff;--pk:#bf5af2;--vi:#bf5af2;
--on:#1c1c1e;--onac:#071525;--hair:rgba(255,255,255,.07);--shadow:none;--scrim:rgba(28,28,30,.8);
--metal:none;--vig:none;--tick:#545458;--seg:rgba(118,118,128,.24);--segon:#636366;--segsh:0 1px 3px rgba(0,0,0,.3)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;
--bg:#1c1c1e;--sb:#242426;--p:#2c2c2e;--p2:#3a3a3c;--ln:#3d3d40;--ln2:#545458;--tx:#f5f5f7;--mu:#a1a1a6;
--bl:#0a84ff;--ac:#0a84ff;--act:#64acff;--acs:rgba(10,132,255,.2);
--gr:#32d74b;--or:#ff9f0a;--rd:#ff453a;--cy:#64d2ff;--pk:#bf5af2;--vi:#bf5af2;
--on:#1c1c1e;--onac:#071525;--hair:rgba(255,255,255,.07);--shadow:none;--scrim:rgba(28,28,30,.8);
--metal:none;--vig:none;--tick:#545458;--seg:rgba(118,118,128,.24);--segon:#636366;--segsh:0 1px 3px rgba(0,0,0,.3)}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--vig),var(--bg);background-repeat:no-repeat;color:var(--tx);font:14px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Sukhumvit Set",Thonburi,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
::selection{background:var(--acs)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
html{scrollbar-color:var(--ln2) transparent}
button,select,input{font-family:inherit}
.app>.main.norail{grid-template-columns:1fr}.app>.main.norail .rt{display:none}
.app{display:grid;grid-template-columns:1fr;height:100vh}
/* sidebar */
.sb{background:var(--sb);border-right:1px solid var(--ln);padding:14px 12px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.brand{display:flex;gap:9px;align-items:center;font-weight:700;font-size:15px;margin-bottom:8px}
.brand{letter-spacing:.14em;font-size:13px;text-transform:uppercase}
.brand i{width:26px;height:30px;display:grid;place-items:center;font-style:normal}
.brand i svg{width:100%;height:100%;display:block}
.ws{border:1px solid var(--ln);border-radius:9px;padding:7px 10px;color:var(--gr);font-size:12px;margin-bottom:10px;background:var(--p)}
.sb h6{margin:16px 8px 4px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mu);font-weight:600}
.nv{display:flex;gap:9px;align-items:center;padding:7px 10px;border-radius:8px;color:var(--mu);cursor:pointer;border:0;background:none;font:inherit;text-align:left;width:100%}
.nv:hover{background:var(--p2);color:var(--tx)}
.nv.on{background:var(--acs);color:var(--tx);font-weight:600;box-shadow:inset 2px 0 0 var(--ac)}
.nv b{width:18px;height:18px;display:grid;place-items:center;font-weight:400}
.nv b svg{width:16px;height:16px}
/* main */
.app>.main{display:grid;grid-template-columns:1fr 330px;grid-template-rows:auto 1fr;min-width:0;min-height:0}
.hd{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:12px 18px 0;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.crumb{color:var(--mu);font-size:12px;width:100%}
.hd h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.01em;display:flex;align-items:center;gap:10px}
.draft{font-size:11px;padding:2px 9px;border-radius:99px;background:color-mix(in srgb,var(--gr) 14%,transparent);color:var(--gr);border:1px solid color-mix(in srgb,var(--gr) 33%,transparent);font-weight:600}
.draft.idle{background:var(--hair);color:var(--mu);border-color:var(--ln)}
.tabsx{display:flex;gap:2px;width:100%}
.tabx{padding:8px 14px;border:0;background:none;color:var(--mu);font:inherit;cursor:pointer;border-bottom:2px solid transparent}
.tabx.on{color:var(--tx);border-color:var(--ac)}
.sp{flex:1}
.btn{padding:7px 14px;border-radius:8px;border:1px solid var(--ln);background:var(--p);color:var(--tx);font:inherit;cursor:pointer}
.btn.pr{background:var(--ac);border-color:var(--ac);color:var(--onac);font-weight:600;letter-spacing:.02em}
.btn:hover{border-color:var(--ln2)}
.cen{padding:20px 22px;display:flex;flex-direction:column;gap:16px;overflow:auto;min-width:0}
.canvas{background:var(--p);border:1px solid var(--ln);border-radius:12px;position:relative;overflow:hidden}
.canvas svg{width:100%;display:block}
.zoom{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--mu)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:var(--metal),var(--p);border:1px solid var(--ln);border-radius:10px;padding:18px 20px;min-width:0;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.card h3 a{color:var(--bl);font-weight:400;font-size:12px}
.src{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:12px}
.src i{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:11px;color:var(--on)}
.src .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src .m{color:var(--mu);font-size:11px}
.badge{font-size:11px;padding:1px 9px;border-radius:6px;border:1px solid}
.badge.ok{color:var(--gr);border-color:color-mix(in srgb,var(--gr) 40%,transparent);background:color-mix(in srgb,var(--gr) 8%,transparent)}
.badge.wk{color:var(--or);border-color:color-mix(in srgb,var(--or) 40%,transparent);background:color-mix(in srgb,var(--or) 8%,transparent)}
.badge.er{color:var(--rd);border-color:color-mix(in srgb,var(--rd) 40%,transparent);background:color-mix(in srgb,var(--rd) 8%,transparent)}
.badge.id{color:var(--mu);border-color:var(--ln)}
.mon{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mon div{border:1px solid var(--ln);border-radius:8px;padding:6px 8px;background:var(--p2)}
.mon small{color:var(--mu);font-size:10px;display:block}
.mon b{font-size:19px;font-weight:300;display:block;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.mon svg{width:100%;height:26px;display:block}
/* right */
.rt{border-left:1px solid var(--ln);background:var(--sb);display:flex;flex-direction:column;min-height:0}
.rtabs{display:flex;border-bottom:1px solid var(--ln)}
.rtabs button{flex:1;padding:11px 4px;border:0;background:none;color:var(--mu);font:inherit;cursor:pointer;border-bottom:2px solid transparent}
.rtabs button.on{color:var(--tx);border-color:var(--ac)}
.rbody{padding:14px;overflow:auto;display:flex;flex-direction:column;gap:18px}
.sec h4{margin:0 0 8px;font-size:13px;display:flex;justify-content:space-between}
.sec h4 a{color:var(--bl);font-weight:400;font-size:12px}
.gate{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:12.5px}
.gate .ic{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;color:var(--on);background:var(--gr)}
.gate .ic.w{background:var(--or)}
.gate span{flex:1}
.gate em{font-style:normal;color:var(--mu);font-size:11px}
.tc{display:flex;align-items:center;gap:16px}
.leg{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mu)}
.leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px}
.tr{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--ln);font-size:12px;cursor:pointer}
.tr:last-child{border:0}
.tr span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr small{color:var(--mu)}
.kv{display:grid;grid-template-columns:90px 1fr;gap:4px 10px;font-size:12px}
.kv dt{color:var(--mu)} .kv dd{margin:0;word-break:break-all}
.txt{white-space:pre-wrap;word-break:break-word;font-size:12px;color:var(--mu);background:var(--p);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;margin-top:6px;max-height:160px;overflow:auto}
.txt.r{color:var(--tx)}
.empty{color:var(--mu);font-size:12px}
/* views */
.kan{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kc{background:var(--p);border:1px solid var(--ln);border-radius:10px;padding:10px;min-height:120px}
.kc h4{margin:0 0 8px;font-size:12px;display:flex;justify-content:space-between;color:var(--mu)}
.cd{border:1px solid var(--ln);border-radius:8px;padding:8px 10px;margin-bottom:8px;background:var(--p2);cursor:pointer}
.cd .t{display:flex;justify-content:space-between;font-size:12px;color:var(--c);font-weight:600}
.cd .t span{color:var(--mu);font-weight:400}
.cd p{margin:4px 0 0;font-size:12px;color:var(--mu);white-space:pre-wrap;word-break:break-word}
.cd p.r{color:var(--tx);border-top:1px dashed var(--ln);padding-top:6px;margin-top:8px}
.jtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}
.jt{flex:none;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--p);border:1px solid var(--ln);color:var(--mu);border-radius:8px;padding:5px 12px;font:inherit;cursor:pointer}
.jt.on{color:var(--tx);border-color:var(--bl)}
.note{border:1px solid color-mix(in srgb,var(--or) 35%,transparent);background:color-mix(in srgb,var(--or) 7%,transparent);padding:7px 12px;border-radius:8px;margin:0 0 10px}
.note small{color:var(--or);display:block;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--mu);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--ln)}
td{padding:6px 8px;border-bottom:1px solid var(--ln);vertical-align:top}
.stu{display:grid;grid-template-columns:260px 1fr;gap:14px}
.cat{display:flex;flex-direction:column;gap:8px;max-height:62vh;overflow:auto}
.pill{display:inline-block;border:1px solid var(--ln);border-radius:9px;padding:0 7px;font-size:10.5px;line-height:17px}
.chip{border:1px solid var(--ln);border-radius:9px;padding:8px 10px;background:var(--p2);cursor:grab;user-select:none}
.chip:hover,.chip.pick{border-color:var(--bl)}
.chip.pick{box-shadow:0 0 0 1px var(--bl) inset}
.chip b{display:block;font-size:12.5px;word-break:break-all}
.chip small{color:var(--mu);font-size:11px;display:flex;justify-content:space-between;gap:6px;margin-top:2px}
.chip .tst{color:var(--bl);cursor:pointer;background:none;border:0;font:inherit;font-size:11px;padding:0}
.okc{color:var(--gr)} .failc{color:var(--rd)}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.seat{border:2px dashed var(--ln);border-radius:12px;padding:12px;min-height:108px;background:var(--p);position:relative;transition:.15s}
.seat.act{border:2px solid var(--bl);background:color-mix(in srgb,var(--bl) 6%,transparent)}
.seat.stby{opacity:.55}
.tcard{margin-bottom:12px}.trow{display:grid;grid-template-columns:12px 70px 170px 1fr 120px 44px 80px;gap:8px;align-items:center;padding:7px 4px;border-top:1px solid var(--ln);font-size:12px}
.trow.tw{animation:nglow 1.3s ease-in-out infinite;--gc:var(--gr);border-radius:8px}.tdot{width:10px;height:10px;border-radius:50%}.tph{color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbar{height:6px;background:var(--ln);border-radius:3px;overflow:hidden}.tbar i{display:block;height:100%}.tn{color:var(--mu);font-size:11px;text-align:right}
@media(max-width:760px){.trow{grid-template-columns:12px 60px 1fr 60px}.trow .tph,.trow .tbar{display:none}}

.now{width:100%;min-width:0;box-sizing:border-box;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.overview-head{display:flex;align-items:center;justify-content:space-between;gap:12px 20px}
.overview-head h2{margin:0;font-size:clamp(20px,2.2vw,30px);line-height:1.25;letter-spacing:-.02em}
.overview-head p{margin:4px 0 0;color:var(--mu);font-size:13px}
.overview-head .btn{white-space:nowrap;flex:none}
.flow-section h3{margin:2px 0 8px;font-size:15px;font-weight:650}
.nlist,.njobs{list-style:none;margin:0;padding:0;background:var(--p);border:1px solid var(--ln);border-radius:12px;overflow:hidden}
.nw{display:grid;grid-template-columns:36px minmax(150px,200px) 104px 1fr auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--ln)}
.nw:first-child,.nj:first-child{border-top:0}
.nav{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;background:var(--c)}
.nw.idle .nav{opacity:.55}
.nw.work{background:color-mix(in srgb,var(--gr) 7%,transparent)}
.nw.work .nav{box-shadow:0 0 0 3px color-mix(in srgb,var(--gr) 35%,transparent);animation:npulse 1.6s cubic-bezier(.16,1,.3,1) infinite}
@keyframes npulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--gr) 12%,transparent)}}
.nwho{display:flex;flex-direction:column;min-width:0}.nwho b{font-size:14px}.nwho small{color:var(--mu);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nmod{font-variant-numeric:tabular-nums}
.npill{justify-self:start;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb,var(--mu) 14%,transparent);color:var(--mu)}
.npill.work{background:color-mix(in srgb,var(--gr) 16%,transparent);color:var(--gr)}.npill.wait{background:color-mix(in srgb,var(--or) 16%,transparent);color:var(--or)}.npill.err{background:color-mix(in srgb,var(--rd) 14%,transparent);color:var(--rd)}
.nwhat{font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nw.idle .nwhat{color:var(--mu)}
.nerr{color:var(--rd)}.nmeta{color:var(--mu);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.nsub{margin:10px 2px 0;font-size:14px;display:flex;align-items:center;gap:10px}.lnk{background:none;border:0;color:var(--ac);cursor:pointer;font:inherit;font-size:12px;padding:0}
.nj{display:flex;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--ln);cursor:pointer;font-size:13px}.nj:hover{background:color-mix(in srgb,var(--ac) 6%,transparent)}
.nj b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nj .nmu{margin-left:auto;white-space:nowrap}
.nempty{padding:18px;color:var(--mu)}
#rail.on{background:color-mix(in srgb,var(--ac) 14%,transparent)}
@media(max-width:760px){.nw{grid-template-columns:32px 1fr auto;row-gap:4px}.nw .nwhat{grid-column:2/4;white-space:normal}.nw .nmeta{grid-column:2/4}.nwho small.nmod{display:none}}
@media (prefers-reduced-motion:reduce){.nw.work .nav{animation:none}}
.lg2{display:inline-flex;align-items:center;gap:5px;margin-right:10px}.lg2 i{width:14px;height:3px;border-radius:2px;display:inline-block}
.flow-section .canvas{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;touch-action:auto}
.flow-section .canvas>svg{grid-column:1/-1;width:100%;height:clamp(370px,52vh,620px);touch-action:none;border-bottom:1px solid var(--ln)}
.flow-section .zoom{position:static;padding:10px 14px;align-self:stretch;cursor:default}
.flow-section .zc{position:static;grid-column:2;grid-row:2;margin:5px 10px;box-shadow:none;background:var(--p2)}
.flow-section .zli{min-width:44px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums}
.flow-section .zc button:focus-visible{outline-offset:-3px}
.stu2{display:flex;flex-direction:column;gap:14px;max-width:1100px;width:100%;margin:0 auto}
.stu2 .card h3{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.stu2 .card h3 .btn{margin-left:auto}
.slist{list-style:none;margin:8px 0 0;padding:0;border:1px solid var(--ln);border-radius:12px;overflow:hidden}
.srow{display:grid;grid-template-columns:36px minmax(130px,160px) minmax(0,1.4fr) minmax(0,1fr) 82px;gap:12px 14px;align-items:center;padding:12px 14px;border-top:1px solid var(--ln);transition:background .15s}
.srow:first-child{border-top:0}.srow:hover{background:color-mix(in srgb,var(--tx) 2.5%,transparent)}
.srow.over{background:color-mix(in srgb,var(--or) 10%,transparent)}
.srow.work{background:color-mix(in srgb,var(--gr) 7%,transparent)}.srow.work .nav{box-shadow:0 0 0 3px color-mix(in srgb,var(--gr) 35%,transparent)}
.srow.empty .nav,.srow.spare .nav{opacity:.5}
.sname{display:flex;flex-direction:column;gap:4px;min-width:0}.sname b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spill{align-self:flex-start;width:fit-content;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--mu) 14%,transparent);color:var(--mu);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.spill.primary{background:color-mix(in srgb,var(--ac) 15%,transparent);color:var(--act)}.spill.work{background:color-mix(in srgb,var(--gr) 16%,transparent);color:var(--gr)}
.sf{display:flex;flex-direction:column;gap:4px;min-width:0;font-size:12px}.sf>span{color:var(--mu);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sf>span em{font-style:normal;opacity:.85}
.sf select,.sf .pos{width:100%;max-width:100%;min-width:0;height:34px;margin:0;padding:0 10px;border:1px solid var(--ln);border-radius:8px;background:var(--p2);color:var(--tx);font:inherit;font-size:12.5px;text-overflow:ellipsis}
.sf select:focus,.sf .pos:focus{outline:2px solid var(--ac);outline-offset:-1px;border-color:var(--ac)}
.sclr{justify-self:end;font-size:12px;height:32px;padding:0 12px}
.catd summary{cursor:pointer;list-style:none}.catd summary::-webkit-details-marker{display:none}.catd summary:before{content:'';display:inline-block;width:7px;height:7px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(-45deg);margin-right:10px;transition:transform .2s}
.catd[open] summary:before{transform:rotate(45deg)}.catd .cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));max-height:50vh;margin-top:12px}
@media(max-width:760px){.srow{grid-template-columns:32px minmax(0,1fr) auto;grid-template-areas:'av nm bt' 'm m m' 'p p p';row-gap:10px;column-gap:12px}.srow>.nav{grid-area:av}.srow>.sname{grid-area:nm}.srow>.sclr,.srow>span:last-child{grid-area:bt}.srow>.sf:nth-of-type(1){grid-area:m}.srow>.sf:nth-of-type(2){grid-area:p}}
.nglow{animation:nglow 1.3s ease-in-out infinite}
.ndot{animation:blink 1s infinite}
@keyframes nglow{0%,100%{filter:drop-shadow(0 0 2px var(--gc))}50%{filter:drop-shadow(0 0 14px var(--gc))}}
@media (prefers-reduced-motion:reduce){.nglow{animation:none;filter:drop-shadow(0 0 8px var(--gc))}.ndot{animation:none}}
.seat.busy{border:2px solid var(--gr);animation:glow 1.4s ease-in-out infinite;opacity:1}
.seat .bz{display:none;margin-top:8px;font-size:11px;color:var(--gr);font-weight:600}
.seat.busy .bz{display:block}

/* ===== shell v2: 3 หน้าหลัก + slide-over drawer ===== */

.cen{max-width:1280px;width:100%;margin:0 auto;overflow:visible}

}

<body>
<div class="app">
<div class="main norail">

    <div class="sp"></div>
    <button class="btn" id="theme" title="สลับโหมดสี: อัตโนมัติ → สว่าง → มืด" aria-label="สลับโหมดสี"></button>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COL={claude:'#c9772b',worker:'#2a8f9d',intern:'#8a6fc4'}, PAL=['#2a8f9d','#8a6fc4','#4f8f5a','#c2566b','#5b7fc7','#9a8a3a','#7a8190'];
const col=n=>COL[n]||PAL[Math.abs([...String(n)].reduce((a,c)=>a+c.charCodeAt(0),0))%PAL.length];
const now=()=>Date.now()/1000, hm=t=>new Date(t*1000).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
const ago=t=>{const s=now()-t;return s<5?'เมื่อกี้':s<60?Math.floor(s)+'s ago':s<3600?Math.floor(s/60)+'m ago':Math.floor(s/3600)+'h ago'};
const pend=a=>a.reply==null&&a.blocked==null&&now()-a.t<300;
const isErr=a=>a.blocked!=null&&a.blocked.startsWith('error:');
const isBlk=a=>a.blocked!=null&&!isErr(a);
const st=a=>a.blocked!=null?'err':pend(a)?'work':'done';
const NOJOB='(ไม่ระบุชื่องาน)';
let S={agents:[],seats:[],catalog:[],roles:[],tasks:[],gateways:[],presets:[],plan:{n:2,mode:'best-of-n'},audit:[],notes:[]}, loaded=false, view='now', rail=false, catOpen=false, rtab='eval', selNode='claude', selJob=null, open=new Set(), pick=null, dragging=false, lastJ='', modal=false, mtab='seq', mjob=null, mev=null, EV=[], mz=1, mpx=0, mpy=0, NBOX=[0,0,1660,520], VBW=1660, VBH=520;

function loadingView(){return `<div class="skel-wrap" aria-busy="true" aria-label="กำลังโหลดข้อมูล"><div class="skel skel-bar"></div><div class="skel skel-canvas"></div><div class="skel skel-list"></div></div>`}
function spark(vals,c,w=100,h=28){
  const list=vals&&vals.length?vals:[0,0];
  const mx=Math.max(...list), m=mx>0?mx:1, n=list.length;
  const top=3, bot=h-4, span=bot-top;
  const p=list.map((v,i)=>[n>1?i*(w/(n-1)):w/2, mx>0?bot-(v/m)*span:bot-1]);
  const d=p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line x1="0" y1="${bot}" x2="${w}" y2="${bot}" stroke="var(--ln)" stroke-width="0.7" stroke-dasharray="2 3"/>${mx>0?`<path d="${d} L${w} ${bot} L0 ${bot}Z" fill="${c}" opacity=".16"/>`:''}<path d="${d}" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="${mx>0?1:.45}"/></svg>`}
function buckets(rows,n=20,step=60){
  const b=Array(n).fill(0);
  rows.forEach(a=>{const i=n-1-Math.floor((now()-a.t)/step);if(i>=0&&i<n)b[i]++});
  if(b.some(v=>v>0)||!rows.length)return b;
  /* fallback: กระจายตามช่วงเวลาจริงของข้อมูลล่าสุดแทนเส้นแบนที่ 0 */
  const ts=rows.map(a=>a.t).filter(Boolean), mn=Math.min(...ts), mx=Math.max(...ts), span=Math.max(1,mx-mn);
  const b2=Array(n).fill(0);
  ts.forEach(t=>{const i=Math.min(n-1,Math.max(0,Math.floor(((t-mn)/span)*(n-1))));b2[i]++});
  return b2;
}

function flowPanel(job){
  const ts=(S.tasks||[]).filter(t=>(t.job||NOJOB)===job&&t.trace); if(!ts.length)return '';
  const rt=Object.fromEntries((S.roles||[]).map(r=>[r.name,r.title]));
  const stat={done:['ok','ผ่านการตรวจ'],rejected:['no','ตีกลับครบรอบ'],error:['no','ผิดพลาด'],blocked:['no','ถูกบล็อก'],check_failed:['no','ไม่ผ่านเช็ก']};

}

function jobNames(){const last={};S.audit.forEach(a=>{const k=a.job||NOJOB;last[k]=Math.max(last[k]||0,a.t)});S.notes.forEach(n=>{const k=n.job||NOJOB;last[k]=Math.max(last[k]||0,n.t)});return Object.keys(last).sort((x,y)=>last[y]-last[x])}
function seqSVG(job){
  const rows=S.audit.filter(a=>(a.job||NOJOB)===job).slice().sort((x,y)=>x.t-y.t), notes=S.notes.filter(n=>(n.job||NOJOB)===job);
  const seatInfo=n=>S.seats.find(s=>s.name===n)||{title:n,catalog:''};
  const lanes=['user','claude',...new Set(rows.map(a=>a.agent))], L=lanes.length;
  const X=i=>L>1?110+i*(780/(L-1)):500, lx=n=>X(lanes.indexOf(n));
  const ev=[]; const t0=rows.length?rows[0].t:(notes[0]?.t||0);
  ev.push({t:t0-.01,f:'user',to:'claude',k:'start',label:job,det:{title:'คำสั่งจากผู้ใช้',text:job}});
  rows.forEach(a=>{
    ev.push({t:a.t,f:'claude',to:a.agent,k:'brief',label:'brief: '+a.brief.slice(0,34)+(a.brief.length>34?'…':''),a,det:{title:`Claude → ${a.agent}`,text:a.brief}});
    if(a.blocked!=null)ev.push({t:a.t+.001,f:a.agent,to:'claude',k:'err',label:a.blocked.slice(0,40),a,det:{title:`${a.agent} → Claude (ผิดพลาด/ถูกบล็อก)`,text:a.blocked}});
    else if(a.reply!=null)ev.push({t:a.t+(a.ms||0)/1000,f:a.agent,to:'claude',k:'reply',label:(a.ms?(a.ms/1000).toFixed(1)+'s · ':'')+a.reply.replace(/\s+/g,' ').slice(0,34),a,det:{title:`${a.agent} → Claude (คำตอบ${a.ms?' · '+(a.ms/1000).toFixed(1)+'s':''})`,text:a.reply}});
    else ev.push({t:1e12,f:a.agent,to:'claude',k:'pend',label:'กำลังทำงาน…',a,det:{title:`${a.agent} กำลังทำงาน`,text:'ยังไม่มีคำตอบ'}});
  });
  notes.forEach(n=>ev.push({t:n.t,f:'claude',to:'user',k:'note',label:'ตรวจผล: '+n.text.slice(0,34)+(n.text.length>34?'…':''),det:{title:'Claude ตรวจผล → ผู้ใช้',text:n.text}}));
  ev.sort((x,y)=>x.t-y.t); EV=ev;
  const RH=58,TOP=104,H=TOP+ev.length*RH+24, C={start:'var(--bl)',brief:null,reply:'var(--gr)',err:'var(--rd)',note:'var(--or)',pend:null};
  let g=`<defs>${[['b','var(--bl)'],['g','var(--gr)'],['r','var(--rd)'],['o','var(--or)'],['c','var(--cy)'],['p','var(--pk)']].map(([i,c])=>`<marker id="mk${i}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="${c}"/></marker>`).join('')}</defs>`;
  lanes.forEach(n=>{const x=lx(n),c=n==='user'?'var(--bl)':col(n),s=n==='user'?{title:'คุณ',catalog:'ผู้ใช้'}:n==='claude'?{title:'Claude',catalog:'Head'}:seatInfo(n);
    g+=`<line x1="${x}" x2="${x}" y1="64" y2="${H}" stroke="var(--ln)" stroke-dasharray="4 6"/><rect x="${x-70}" y="10" width="140" height="48" rx="10" fill="var(--p)" stroke="${c}" stroke-width="1.6"/>
    <text x="${x}" y="30" text-anchor="middle" fill="${c}" font-weight="700" font-size="13">${esc(s.title)}</text><text x="${x}" y="46" text-anchor="middle" fill="var(--mu)" font-size="10">${esc(String(s.catalog||'').slice(0,22))}</text>`});
  ev.forEach((e,i)=>{const y=TOP+i*RH,x1=lx(e.f),x2=lx(e.to),dir=x2>x1?1:-1,sel=mev===i;
    const seat=e.k==='brief'||e.k==='pend'?(e.k==='brief'?e.to:e.f):null;
    const c=C[e.k]||col(seat), mk=c==='var(--bl)'?'b':c==='var(--gr)'?'g':c==='var(--rd)'?'r':c==='var(--or)'?'o':c==='var(--cy)'?'c':'p';
    const dash=e.k==='pend'?'stroke-dasharray="6 6" style="animation:fl .7s linear infinite"':'';
    const mid=(x1+x2)/2, w=Math.max(180,Math.abs(x2-x1)-16);
    g+=`<g class="evg ${sel?'sel':''}" data-ev="${i}"><rect class="hit" x="${Math.min(x1,x2)-4}" y="${y-30}" width="${Math.abs(x2-x1)+8}" height="${RH-6}" rx="8" fill="transparent"/>
      <line class="al" x1="${x1+dir*3}" x2="${x2-dir*5}" y1="${y}" y2="${y}" stroke="${c}" stroke-width="2.2" ${dash} marker-end="url(#mk${mk})"/>
      <text x="${mid}" y="${y-8}" text-anchor="middle" font-size="11" fill="${sel?'var(--tx)':'var(--mu)'}">${esc(e.label)}</text>
      <text x="8" y="${y+4}" font-size="10" fill="var(--mu)">${e.k==='pend'?'…':hm(e.t)}</text></g>`;

/* ซูม/แพน: ผังเครือข่าย (ทั้งในหน้า Design และใน Flow Inspector) ใช้ transform ใน SVG — กรอบคงที่ เนื้อหาย่อ/ขยาย
   ลำดับการไหล (ในหน้าต่างขยาย) ใช้ความกว้าง + เลื่อน */
const ZMIN=.3, ZMAX=4, clampZ=z=>Math.min(ZMAX,Math.max(ZMIN,z));
const CTX={
  m:{get z(){return mz},set z(v){mz=v},get x(){return mpx},set x(v){mpx=v},get y(){return mpy},set y(v){mpy=v},root:()=>$('mmain'),label:()=>$('zl')},
  i:{z:1,x:0,y:0,root:()=>document.querySelector('#cen .canvas'),label:()=>document.querySelector('#cen .zli')}
};
const isNet=c=>c!==CTX.m||mtab==='net';
function applyCtx(c){
  const r=c.root(), l=c.label(); if(l)l.textContent=Math.round(c.z*100)+'%';
  const g=r&&r.querySelector('.zg'), cx=VBW/2, cy=VBH/2;
  if(g&&isNet(c))g.setAttribute('transform',`translate(${cx+c.x},${cy+c.y}) scale(${c.z}) translate(${-cx},${-cy})`);
}
const applyNet=()=>applyCtx(CTX.m);
function netView(c,cx,cy){const svg=c.root()&&c.root().querySelector('svg'); if(!svg)return null;const b=svg.getBoundingClientRect(),{width,height}=svg.viewBox.baseVal,s=Math.min(b.width/width,b.height/height)||1;
  return {s,pt:cx==null?[width/2,height/2]:[(cx-b.left-(b.width-width*s)/2)/s,(cy-b.top-(b.height-height*s)/2)/s]}}
function setZoom(z,cx,cy,c){
  c=c||CTX.m; z=clampZ(z); const k=z/c.z; if(k===1)return;
  if(isNet(c)){const v=netView(c,cx,cy); if(!v)return; const ox=VBW/2, oy=VBH/2; c.x=v.pt[0]-ox-k*(v.pt[0]-ox-c.x); c.y=v.pt[1]-oy-k*(v.pt[1]-oy-c.y); c.z=z; applyCtx(c); return}
  const m=$('mmain'), bb=m.getBoundingClientRect(), ax=cx==null?m.clientWidth/2:cx-bb.left, ay=cy==null?m.clientHeight/2:cy-bb.top;
  const nx=(m.scrollLeft+ax)*k-ax, ny=(m.scrollTop+ay)*k-ay; mz=z; renderModal(); m.scrollLeft=nx; m.scrollTop=ny;
}
function zoomReset(c){c=c||CTX.m;c.z=1;c.x=0;c.y=0;if(c===CTX.m&&modal)renderModal();else applyCtx(c)}
function zoomFit(c){
  c=c||CTX.m;
  if(isNet(c)){const [x0,y0,x1,y1]=NBOX,bw=x1-x0,bh=y1-y0; c.z=clampZ(Math.min(VBW*.92/bw,VBH*.92/bh)); c.x=-c.z*((x0+x1)/2-VBW/2); c.y=-c.z*((y0+y1)/2-VBH/2); applyCtx(c)}
  else{zoomReset(c); $('mmain').scrollTop=0; $('mmain').scrollLeft=0}
}
document.addEventListener('wheel',e=>{
  if(!(e.ctrlKey||e.metaKey))return;
  if(modal){if(e.target.closest('#mmain')){e.preventDefault();setZoom(mz*Math.exp(-e.deltaY*.0025),e.clientX,e.clientY,CTX.m)}return}
  if(e.target.closest('#cen .canvas')){e.preventDefault();setZoom(CTX.i.z*Math.exp(-e.deltaY*.0025),e.clientX,e.clientY,CTX.i)}
},{passive:false});
let pan=null;
document.addEventListener('mousedown',e=>{
  if(e.button!==0||e.target.closest('.evg,[data-n],button,.zc'))return;
  let c=null,el=null;
  if(modal){if(e.target.closest('#mmain')){c=CTX.m;el=$('mmain')}}
  else if(e.target.closest('#cen .canvas')){c=CTX.i;el=document.querySelector('#cen .canvas')}
  if(!c)return;
  pan={c,el,x:e.clientX,y:e.clientY,l:el.scrollLeft,t:el.scrollTop,px:c.x,py:c.y,s:(isNet(c)&&netView(c)||{s:1}).s};el.classList.add('pan')});
window.addEventListener('mousemove',e=>{if(!pan)return;const dx=e.clientX-pan.x,dy=e.clientY-pan.y;
  if(isNet(pan.c)){pan.c.x=pan.px+dx/pan.s;pan.c.y=pan.py+dy/pan.s;applyCtx(pan.c)}else{pan.el.scrollLeft=pan.l-dx;pan.el.scrollTop=pan.t-dy}});

function summary(){
  const A=S.audit||[], q=S.queue||{}, seats=(S.seats||[]), ready=seats.filter(x=>x.model).length;
  const ok=A.filter(a=>st(a)==='done').length, er=A.filter(a=>st(a)==='err').length, rate=ok+er?Math.round(ok*100/(ok+er)):null;
  const busy=(q.running||0)+(q.queued||0);
  const wk=(typeof U!=='undefined'&&U&&U.plan)?(U.plan.windows.find(w=>/weekly/i.test(w.label)&&/all/i.test(w.label))||{}).pct:null;
  const row=(l,v,sub,dot)=>`<div class="lr" title="${sub}"><span class="ld" style="background:${dot}"></span><span class="lt">${l}</span><span class="lv">${v}</span></div>`;
  return `<section class="grp" aria-label="สรุปภาพรวม">
    ${row('ทีมพร้อมทำงาน',`${ready} / ${seats.length}`,'ช่องที่ใส่โมเดลไว้แล้ว','var(--gr)')}
    ${row('งานที่กำลังทำหรือรอคิว',busy,'ตอนนี้','var(--or)')}
    ${row('งานที่ผ่านสำเร็จ',rate==null?'—':rate+'%','จาก 150 ครั้งล่าสุดที่เรียก AI',rate==null||rate>=70?'var(--gr)':rate>=40?'var(--or)':'var(--rd)')}
    ${row('โควตา Claude รายสัปดาห์',wk==null?'—':wk+'%','ภาพที่บันทึกไว้ ไม่อัปเดตเอง',wk==null||wk<60?'var(--ac)':wk<85?'var(--or)':'var(--rd)')}
  </section>`;
}

document.addEventListener('change',async e=>{const sel=e.target.closest&&e.target.closest('[data-lead]');if(!sel)return;try{const d=await apiRaw('/api/lead',{squad:sel.dataset.lead,seat:sel.value});if(d.error)alert(d.error)}catch(x){alert(String(x))}document.activeElement&&document.activeElement.blur();await loadRank()});

const pct=v=>v==null?'—':Math.round(v*100)+'%';

  const tiers=[['light','งานเบา'],['standard','งานมาตรฐาน'],['heavy','งานหนัก / คุณภาพสูง']].map(([k,l])=>{const o=RK.tiers[k]||[];

function routingView(){
  if(!RT)return '<div class="card" style="color:var(--mu)">กำลังโหลดข้อมูล routing…</div>';
  const R=RT,kpi=(l,v,s,c)=>`<div class="card" style="flex:1;min-width:160px"><div style="color:var(--mu);font-size:11px">${l}</div><div style="font-size:22px;font-weight:800;color:${c||'var(--tx)'};font-variant-numeric:tabular-nums">${v}</div><div style="color:var(--mu);font-size:11px">${s||''}</div></div>`;
  const sh=R.share,shp=sh.total?Math.round(sh.team*100/sh.total):null,d0=R.caps[0];
  const capRow=c=>{const p=c.cap_tokens?c.tokens/c.cap_tokens:null;return `<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:12px;gap:8px"><span>ทีมฟรี ${c.scope}</span><span style="color:var(--mu);font-variant-numeric:tabular-nums">${fmtN(Math.round(c.tokens))} โทเคน${c.cap_tokens?' / เพดาน '+fmtN(c.cap_tokens):' (ไม่จำกัด)'}${c.cap_usd?` · $${c.usd.toFixed(2)} / $${c.cap_usd}`:''}</span></div>${p==null?'':bar(p,p>=.8?'var(--or)':'var(--gr)')}</div>`};
  const lanes=[['action','ลงมือ/กด'],['general','ทั่วไป'],['judgment','ตัดสินใจ'],['bulk','งานเบาเป็นชุด']].map(([k,l])=>`<tr><td>${l}</td><td><b>${esc(R.lanes[k]||'ถามผู้ใช้')}</b></td></tr>`).join('');
  const mx=Math.max(1,...R.days.map(d=>d.team+d.claude));
  const dFmt=t=>new Date(t*1000).toLocaleDateString('th-TH',{day:'numeric',month:'short'});
  const dFirst=R.days[0]?dFmt(R.days[0].t):'', dMid=R.days[Math.floor(R.days.length/2)]?dFmt(R.days[Math.floor(R.days.length/2)].t):'', dLast=R.days.length?dFmt(R.days[R.days.length-1].t):'';
  const days=`<div style="display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--mu);margin-bottom:4px"><span>การใช้โทเคนย้อนหลัง 14 วัน</span><span style="font-variant-numeric:tabular-nums">สูงสุด ${fmtN(Math.round(mx))}/วัน</span></div>

    <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--mu);margin-top:4px;font-variant-numeric:tabular-nums"><span>${esc(dFirst)}</span><span>${esc(dMid)}</span><span>${esc(dLast)}</span></div>
    <div style="display:flex;gap:12px;font-size:11px;color:var(--mu);margin-top:6px"><span><i style="display:inline-block;width:8px;height:8px;background:var(--cy);border-radius:2px"></i> ทีมฟรี</span><span><i style="display:inline-block;width:8px;height:8px;background:var(--or);border-radius:2px"></i> Claude</span></div>`;

let rankSort='overall';
function rankView(){
  const R=S.rank||{cats:[],rows:[]}; if(!R.rows.length)return '<div class="card" style="color:var(--mu)">ยังไม่มีผลทดสอบ — รัน train.py / train_hard.py ก่อน</div>';

  const val=(r,k)=>k==='overall'?r.overall:k==='hard'?r.hard:k==='speed'?null:r.cats[k]?.p;
  const rows=[...R.rows].sort((a,b)=>rankSort==='speed'?((a.speed??1e12)-(b.speed??1e12)):((val(b,rankSort)??-1)-(val(a,rankSort)??-1)||b.overall-a.overall||(a.speed??1e12)-(b.speed??1e12)));
  const best={}; keys.concat(['hard']).forEach(k=>{const m=Math.max(-1,...R.rows.map(r=>val(r,k)??-1));best[k]=m});
  const sp=Math.min(...R.rows.map(r=>r.speed||1e12));
  const champs=R.cats.map(([k,l])=>{const m=best[k]; if(m<0)return ''; const w=R.rows.filter(r=>r.cats[k]?.p===m);
    return `<div class="rk-ch"><small>${esc(l)}</small><b style="color:${col(w[0].seat)}">${w.slice(0,2).map(x=>esc(x.seat)).join(' · ')}${w.length>2?' +'+(w.length-2):''}</b><small>${m}%${w.length>1?' · เสมอ '+w.length+' ตัว':' · '+esc((w[0].model||'').split('/').pop())}</small></div>`}).join('');
  const th=(k,l)=>`<th data-rk="${k}" class="${rankSort===k?'on':''}" title="เรียงตามคอลัมน์นี้">${esc(l)}${rankSort===k?' ▾':''}</th>`;
  const cell=(r,k)=>{const v=val(r,k); if(v==null)return '<td class="rk-no">—</td>'; const n=k==='overall'||k==='hard'?0:r.cats[k].n;
    return `<td class="rk-c${v===best[k]?' best':''}${n&&n<6?' low':''}" title="${n?n+' ครั้ง':''}"><b>${v}%</b><i style="width:${Math.max(3,v*.36)}px"></i></td>`};
  return `<div style="display:flex;flex-direction:column;gap:12px">
  <div><h3 style="margin:0 0 2px">ผลทดสอบมาตรฐาน (Benchmark)</h3><div style="color:var(--mu);font-size:12px">คะแนนจากโจทย์ทดสอบจริงที่ตรวจอัตโนมัติ (ก่อนใส่คู่มือสั่งงาน ไม่นับครั้งที่ระบบล้ม) · คลิกหัวคอลัมน์เพื่อเรียง · ตัวเลขจางคือโจทย์น้อยกว่า 6 ครั้ง · เลื่อนตารางด้านข้างได้ถ้าหน้าจอแคบ</div></div>
  <div class="rk-champs">${champs}</div>
  <div class="card rk-wrap"><table class="rk-t"><tr><th>#</th><th style="text-align:left">สมาชิก / โมเดล</th>${th('overall','รวม')}${R.cats.map(([k,l])=>th(k,l)).join('')}${th('hard','ยาก')}${th('speed','เร็ว (กลาง)')}<th>ทดสอบ</th></tr>
  ${rows.map((r,i)=>`<tr><td class="rk-no">${i+1}</td><td><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${col(r.seat)};margin-right:7px"></span><b>${esc(r.seat)}</b> <span style="color:var(--mu);font-size:11px">${esc((r.model||'').split('/').pop())}</span></td>${cell(r,'overall')}${R.cats.map(([k])=>cell(r,k)).join('')}${cell(r,'hard')}<td class="rk-c${r.speed===sp?' best':''}"><b>${r.speed?(r.speed/1000).toFixed(1)+'s':'—'}</b></td><td class="rk-no">${r.n}</td></tr>`).join('')}</table></div></div>`;
}

  out.push(...fails.slice(0,4));if(fails.length>4)out.push({lv:'wk',t:`และอีก ${fails.length-4} งานที่ยังไม่ผ่าน`,s:'งานเก่าที่ถูกตีกลับหรือผิดพลาด ทยอยเปิดดูหรือรันใหม่ได้ในหน้า “งานที่แจก”',a:[['ดูงานทั้งหมด','data-goto="jobs"']]});

  if(empty)out.push({lv:'wk',t:`มี ${empty} ช่องในทีมยังว่าง`,s:'ช่องว่างไม่ถูกใช้ทำงาน',a:[['ไปจัดทีม','data-goto="studio"',1]]});
  const bad2=seats.filter(x=>x.model&&(S.catalog.find(k=>k.name===x.catalog)||{}).status==='fail');
  if(bad2.length)out.push({lv:'er',t:`โมเดลของ ${esc(bad2.map(x=>x.name).join(', '))} เรียกไม่ได้`,s:'ผลทดสอบล่าสุดล้มเหลว เปลี่ยนโมเดลหรือเช็ก key',a:[['ไปแก้ที่จัดทีม','data-goto="studio"',1]]});
  (S.gateways||[]).filter(g=>!g.has_key).forEach(g=>out.push({lv:'wk',t:`ผู้ให้บริการ ${esc(g.name)} ยังไม่มี API key`,s:'ใส่ key ก่อนจึงจะเรียกโมเดลได้',a:[['ไปใส่ key','data-goto="studio"',1]]}));
  const fin=Object.entries(byJob).filter(([k,ts])=>{const last=ts.slice().sort((x,y)=>y.id-x.id)[0];return last&&last.status==='done'}).sort((a,b)=>Math.max(...b[1].map(x=>x.id))-Math.max(...a[1].map(x=>x.id))).slice(0,3);
  fin.forEach(([k])=>out.push({lv:'ok',t:`งาน “${esc(k)}” ผ่านการตรวจแล้ว`,s:'เปิดอ่านผลลัพธ์หรือดาวน์โหลดรายงาน',a:[['ดูผลงาน',`data-open="${esc(k)}"`,1]]}));
  const rk={er:0,wk:1,ok:2};return out.sort((x,y)=>rk[x.lv]-rk[y.lv]);
}
function homeView(){
  const roles=(S.roles||[]).filter(r=>r.kind==='maker'), td=todos(), q=S.queue||{};
  const act=td.filter(x=>x.lv!=='ok'), done=td.filter(x=>x.lv==='ok');
  const item=x=>`<div class="td ${x.lv}"><span class="tdd"></span><div class="tdt"><b>${x.t}</b><small title="${esc(x.s)}">${esc(x.s)}</small></div><div class="tda">${x.a.map(([l,at,pr])=>`<button class="btn ${pr?'pr':''}" ${at}>${l}</button>`).join('')}</div></div>`;
  const todoHtml=(act.length?act.map(item).join(''):'<div class="td ok"><span class="tdd"></span><div class="tdt"><b>ไม่มีรายการค้าง</b><small>ทีมพร้อมรับงานใหม่</small></div></div>')+(done.length?`<div class="td-sub">เพิ่งผ่านการตรวจ (${done.length})</div>${done.map(item).join('')}`:'');
  return `${summary()}
  <div class="home"><section class="card" id="hform"><h3>สั่งงานทีม</h3>
    <label class="hl">โจทย์ที่อยากให้ทีมทำ<textarea id="hbrief" rows="6" placeholder="เช่น สรุปข้อดีข้อเสียของ 3 แนวทางนี้ แล้วแนะนำข้อที่ควรเลือก พร้อมเหตุผล…">${esc(HD.brief)}</textarea></label>
    <div class="hr"><label class="hl">ชื่องาน (ไม่ใส่ก็ได้)<input id="hjob" type="text" value="${esc(HD.job)}" placeholder="ตั้งชื่อให้หาง่าย"></label>
    <label class="hl">ให้ใครทำ<select id="hrole">${roles.map(r=>`<option value="${esc(r.name)}" ${HD.role===r.name?'selected':''}>${esc(r.title)}</option>`).join('')}</select></label></div>
    <div class="hr"><label class="hck"><input id="hrev" type="checkbox" ${HD.review?'checked':''}> ให้ผู้ตรวจตรวจก่อนส่งผล</label>
    <label class="hl sm ${HD.review?'':'dim'}">ตีกลับแก้ได้สูงสุด<select id="hrounds" ${HD.review?'':'disabled'}>${[1,2,3].map(n=>`<option ${HD.rounds===n?'selected':''} value="${n}">${n} รอบ</option>`).join('')}</select></label></div>
    <div class="hr end"><span class="hmsg ${HD.msg.startsWith('✓')?'ok':'er'}">${esc(HD.msg)}</span><button class="btn pr" id="hsub" ${HD.busy?'disabled':''}>${HD.busy?'กำลังส่ง…':'สั่งงาน'}</button></div>
    <p class="hint">ระบบเลือก AI ที่ถนัดงานนี้ให้เอง ผ่านด่านตรวจความปลอดภัยก่อนส่ง · ตอนนี้คิว ${q.running||0} กำลังทำ · ${q.queued||0} รอ</p></section>
  <section class="card"><h3>ต้องทำอะไรต่อ ${act.length?`<span class="badge wk">${act.length} รายการ</span>`:'<span class="badge ok">ครบแล้ว</span>'}</h3><div class="tds">${todoHtml}</div></section></div>`;
}
async function hSubmit(){
  if(HD.busy)return; if(document.activeElement&&document.activeElement.blur)document.activeElement.blur(); HD.busy=true; HD.msg=''; render();
  const d=await apiRaw('/api/submit',{brief:HD.brief,job:HD.job,role:HD.role,review:HD.review,rounds:HD.rounds}).catch(e=>({error:e.message}));
  HD.busy=false;
  if(d.error)HD.msg=d.error; else{HD.msg=`✓ ส่งแล้ว (งาน #${d.id})${d.worker_started?' · เริ่มตัวรันให้แล้ว':''} — ดูความคืบหน้าที่แท็บ “งานที่แจก”`;HD.brief='';HD.job=''}
  await tick(true);
}
document.addEventListener('input',e=>{const i=e.target.id;if(i==='hbrief')HD.brief=e.target.value;else if(i==='hjob')HD.job=e.target.value});
document.addEventListener('change',e=>{const i=e.target.id;if(i==='hrole')HD.role=e.target.value;else if(i==='hrev'){HD.review=e.target.checked;render()}else if(i==='hrounds')HD.rounds=+e.target.value});
document.addEventListener('click',async e=>{
  if(e.target.id==='hsub'){hSubmit();return}
  const g=e.target.closest('[data-goto]');if(g){view=g.dataset.goto;render();return}
  const a=e.target.closest('[data-act="start_worker"]');if(a){await post('/api/start_worker',{});return}
  const r=e.target.closest('[data-requeue]');if(r){r.disabled=true;await post('/api/requeue',{id:+r.dataset.requeue});return}
  const p=e.target.closest('[data-rpt]');if(p){const k=p.dataset.rpt;if(RPTO===k){RPTO=null;render();return}RPTO=k;if(!RPT[k]){RPT[k]='กำลังโหลด…';render();RPT[k]=await (await fetch('/api/report?job='+encodeURIComponent(k))).text()}render();return}
  const cp=e.target.closest('[data-copy]');if(cp){try{await navigator.clipboard.writeText(RPT[cp.dataset.copy]||'');cp.textContent='คัดลอกแล้ว'}catch(_){cp.textContent='คัดลอกไม่ได้'}}
});

async function tick(force){if(dragging)return;try{const n=await (await fetch('/api/state')).json(),j=JSON.stringify(n);const first=!loaded;loaded=true;const ch=j!==lastJ;if(first||force===true||ch||view==='now'){lastJ=j;S=n;render();if(modal&&(ch||force===true))renderModal()}}catch(e){}}
(()=>{const h=new URLSearchParams(location.hash.slice(1));if(h.get('view'))view=h.get('view');if(h.get('rtab'))rtab=h.get('rtab');if(h.get('job'))selJob=h.get('job');if(h.get('jv'))jv=h.get('jv')==='table'?'table':'board';if(h.get('open')){jobPage=true}if(h.get('modal')){modal=true;mtab=h.get('modal')==='net'?'net':'seq';if(h.get('job'))mjob=h.get('job')}if(h.get('zoom'))mz=Math.min(4,Math.max(.4,+h.get('zoom')||1))})();
render();
tick(); setInterval(tick,2000);
document.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('catd'))catOpen=e.target.open},true);
</script>
</body>
