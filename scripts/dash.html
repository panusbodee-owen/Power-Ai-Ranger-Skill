<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>AI Team Studio</title>
<style>
:root{--bg:#070b16;--sb:#0a1020;--p:#0e1527;--p2:#121b30;--ln:#1f2a44;--tx:#e6ebf7;--mu:#8693b3;
--bl:#3b82f6;--vi:#8b5cf6;--or:#f59e0b;--gr:#22c55e;--rd:#ef4444;--cy:#22d3ee;--pk:#c084fc}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.45 system-ui,"Noto Sans Thai",sans-serif}
.app{display:grid;grid-template-columns:200px 1fr;height:100vh}
/* sidebar */
.sb{background:var(--sb);border-right:1px solid var(--ln);padding:14px 12px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.brand{display:flex;gap:9px;align-items:center;font-weight:700;font-size:15px;margin-bottom:8px}
.brand i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--bl),var(--vi));display:grid;place-items:center;font-style:normal;font-size:14px}
.ws{border:1px solid var(--ln);border-radius:9px;padding:7px 10px;color:var(--gr);font-size:12px;margin-bottom:10px;background:var(--p)}
.sb h6{margin:12px 8px 4px;font-size:10px;letter-spacing:.1em;color:var(--mu);font-weight:600}
.nv{display:flex;gap:9px;align-items:center;padding:7px 10px;border-radius:8px;color:var(--mu);cursor:pointer;border:0;background:none;font:inherit;text-align:left;width:100%}
.nv:hover{background:var(--p2);color:var(--tx)}
.nv.on{background:#3b82f622;color:#7db0ff;box-shadow:inset 2px 0 0 var(--bl)}
.nv b{width:16px;text-align:center;font-weight:400}
/* main */
.main{display:grid;grid-template-columns:1fr 330px;grid-template-rows:auto 1fr;min-width:0;min-height:0}
.hd{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:12px 18px 0;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.crumb{color:var(--mu);font-size:12px;width:100%}
.hd h1{margin:0;font-size:20px;display:flex;align-items:center;gap:10px}
.draft{font-size:11px;padding:2px 9px;border-radius:99px;background:#22c55e22;color:var(--gr);border:1px solid #22c55e55;font-weight:600}
.draft.idle{background:#ffffff0d;color:var(--mu);border-color:var(--ln)}
.tabsx{display:flex;gap:2px;width:100%}
.tabx{padding:8px 14px;border:0;background:none;color:var(--mu);font:inherit;cursor:pointer;border-bottom:2px solid transparent}
.tabx.on{color:#7db0ff;border-color:var(--bl)}
.sp{flex:1}
.btn{padding:7px 14px;border-radius:8px;border:1px solid var(--ln);background:var(--p);color:var(--tx);font:inherit;cursor:pointer}
.btn.pr{background:var(--bl);border-color:var(--bl);font-weight:600}
.cen{padding:14px;display:flex;flex-direction:column;gap:14px;overflow:auto;min-width:0}
.canvas{background:radial-gradient(circle,#ffffff10 1px,transparent 1px) 0 0/22px 22px,var(--p);border:1px solid var(--ln);border-radius:12px;position:relative;overflow:hidden}
.canvas svg{width:100%;display:block}
.zoom{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--mu)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:var(--p);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;min-width:0}
.card h3{margin:0 0 10px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.card h3 a{color:var(--bl);font-weight:400;font-size:12px}
.src{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:12px}
.src i{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:11px;color:#0a0f1c}
.src .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src .m{color:var(--mu);font-size:11px}
.badge{font-size:11px;padding:1px 9px;border-radius:6px;border:1px solid}
.badge.ok{color:var(--gr);border-color:#22c55e66;background:#22c55e14}
.badge.wk{color:var(--or);border-color:#f59e0b66;background:#f59e0b14}
.badge.er{color:var(--rd);border-color:#ef444466;background:#ef444414}
.badge.id{color:var(--mu);border-color:var(--ln)}
.mon{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mon div{border:1px solid var(--ln);border-radius:8px;padding:6px 8px;background:var(--p2)}
.mon small{color:var(--mu);font-size:10px;display:block}
.mon b{font-size:17px;display:block}
.mon svg{width:100%;height:26px;display:block}
/* right */
.rt{border-left:1px solid var(--ln);background:var(--sb);display:flex;flex-direction:column;min-height:0}
.rtabs{display:flex;border-bottom:1px solid var(--ln)}
.rtabs button{flex:1;padding:11px 4px;border:0;background:none;color:var(--mu);font:inherit;cursor:pointer;border-bottom:2px solid transparent}
.rtabs button.on{color:#7db0ff;border-color:var(--bl)}
.rbody{padding:14px;overflow:auto;display:flex;flex-direction:column;gap:18px}
.sec h4{margin:0 0 8px;font-size:13px;display:flex;justify-content:space-between}
.sec h4 a{color:var(--bl);font-weight:400;font-size:12px}
.gate{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:12.5px}
.gate .ic{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;color:#04130a;background:var(--gr)}
.gate .ic.w{background:var(--or)}
.gate span{flex:1}
.gate em{font-style:normal;color:var(--mu);font-size:11px}
.tc{display:flex;align-items:center;gap:16px}
.leg{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mu)}
.leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px}
.tr{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--ln);font-size:12px;cursor:pointer}
.tr:last-child{border:0}
.tr span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr small{color:var(--mu)}
.kv{display:grid;grid-template-columns:90px 1fr;gap:4px 10px;font-size:12px}
.kv dt{color:var(--mu)} .kv dd{margin:0;word-break:break-all}
.txt{white-space:pre-wrap;word-break:break-word;font-size:12px;color:var(--mu);background:var(--p);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;margin-top:6px;max-height:160px;overflow:auto}
.txt.r{color:var(--tx)}
.empty{color:var(--mu);font-size:12px}
/* views */
.kan{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kc{background:var(--p);border:1px solid var(--ln);border-radius:10px;padding:10px;min-height:120px}
.kc h4{margin:0 0 8px;font-size:12px;display:flex;justify-content:space-between;color:var(--mu)}
.cd{border:1px solid var(--ln);border-left:3px solid var(--c);border-radius:8px;padding:8px 10px;margin-bottom:8px;background:var(--p2);cursor:pointer}
.cd .t{display:flex;justify-content:space-between;font-size:12px;color:var(--c);font-weight:600}
.cd .t span{color:var(--mu);font-weight:400}
.cd p{margin:4px 0 0;font-size:12px;color:var(--mu);white-space:pre-wrap;word-break:break-word}
.cd p.r{color:var(--tx);border-top:1px dashed var(--ln);padding-top:6px;margin-top:8px}
.jtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}
.jt{flex:none;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--p);border:1px solid var(--ln);color:var(--mu);border-radius:8px;padding:5px 12px;font:inherit;cursor:pointer}
.jt.on{color:var(--tx);border-color:var(--bl)}
.note{border-left:3px solid var(--or);background:#f59e0b12;padding:7px 12px;border-radius:0 8px 8px 0;margin:0 0 10px}
.note small{color:var(--or);display:block;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--mu);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--ln)}
td{padding:6px 8px;border-bottom:1px solid var(--ln);vertical-align:top}
.stu{display:grid;grid-template-columns:260px 1fr;gap:14px}
.cat{display:flex;flex-direction:column;gap:8px;max-height:62vh;overflow:auto}
.chip{border:1px solid var(--ln);border-radius:9px;padding:8px 10px;background:var(--p2);cursor:grab;user-select:none}
.chip:hover,.chip.pick{border-color:var(--bl)}
.chip.pick{box-shadow:0 0 0 1px var(--bl) inset}
.chip b{display:block;font-size:12.5px;word-break:break-all}
.chip small{color:var(--mu);font-size:11px;display:flex;justify-content:space-between;gap:6px;margin-top:2px}
.chip .tst{color:var(--bl);cursor:pointer;background:none;border:0;font:inherit;font-size:11px;padding:0}
.okc{color:var(--gr)} .failc{color:var(--rd)}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.seat{border:2px dashed var(--ln);border-radius:12px;padding:12px;min-height:108px;background:var(--p);position:relative;transition:.15s}
.seat.act{border:2px solid var(--bl);background:#3b82f610}
.seat.stby{opacity:.55}
.seat.over{border-color:var(--or);background:#f59e0b14}
.seat h5{margin:0 0 6px;font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between}
.seat .m{font-weight:700;font-size:13px;word-break:break-all}
.seat .g{color:var(--mu);font-size:11px}
.seat .x{position:absolute;top:22px;right:10px;color:var(--mu);cursor:pointer;background:none;border:0;font-size:14px}
.seat .emp{color:var(--mu);font-size:12px;margin-top:10px}
.ctl{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--ln)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--ln);border-radius:9px;overflow:hidden}
.stepper button{width:32px;height:32px;border:0;background:var(--p2);color:var(--tx);font-size:16px;cursor:pointer}
.stepper b{min-width:38px;text-align:center}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:9px;overflow:hidden}
.seg button{padding:7px 12px;border:0;background:var(--p2);color:var(--mu);font:inherit;cursor:pointer}
.seg button.on{background:var(--bl);color:#fff}
.hint{color:var(--mu);font-size:12px;margin-top:8px}
.pos{margin-top:8px;width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:7px;padding:4px 6px;font:inherit;font-size:12px}
.fl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;border:1px solid var(--ln);border-radius:8px;padding:6px 10px;margin-bottom:6px;background:var(--p2)}
.fl b{color:var(--mu);font-weight:600}
.fl .st{padding:1px 8px;border-radius:6px;border:1px solid}
.fl .ok{color:var(--gr);border-color:#22c55e66}.fl .no{color:var(--rd);border-color:#ef444466}
.cen>*{flex:none}
.canvas{touch-action:none}
.canvas .zc{top:auto;bottom:10px;right:12px}
.xbtn{position:absolute;top:10px;right:12px;z-index:2;background:#0c1426cc;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:5px 11px;font:inherit;font-size:12px;cursor:pointer}
.xbtn:hover{border-color:var(--bl);color:#7db0ff}
#modal{position:fixed;inset:0;background:#05080fee;backdrop-filter:blur(4px);z-index:50;display:flex}
#modal[hidden]{display:none}
.mbox{margin:16px;flex:1;display:flex;flex-direction:column;background:var(--sb);border:1px solid var(--ln);border-radius:14px;min-width:0;overflow:hidden}
.mh{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.mh b{font-size:15px}
.mtabs{display:inline-flex;border:1px solid var(--ln);border-radius:9px;overflow:hidden}
.mtabs button{padding:6px 12px;border:0;background:var(--p2);color:var(--mu);font:inherit;cursor:pointer}
.mtabs button.on{background:var(--bl);color:#fff}
.mjobs{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:180px}
.mx{background:none;border:1px solid var(--ln);color:var(--tx);border-radius:8px;width:32px;height:32px;font-size:15px;cursor:pointer}
.mbody{flex:1;display:grid;grid-template-columns:1fr 340px;min-height:0}
.mmain{overflow:auto;padding:14px;min-width:0;cursor:grab;overscroll-behavior:contain}
.mmain.pan{cursor:grabbing;user-select:none}
.mmain .evg,.mmain [data-n]{cursor:pointer}
.mmain .canvas{max-width:none}
.mwrap{position:relative;min-width:0;min-height:0;display:flex}
.mwrap .mmain{flex:1}
.canvas{cursor:grab}
.canvas.pan{cursor:grabbing;user-select:none}
.mmain.net{padding:0;overflow:hidden}
.mmain.net .canvas{height:100%;border:0;border-radius:0;background-color:var(--bg)}
.mmain.net .canvas svg{width:100%;height:100%}
.zc{position:absolute;top:14px;right:18px;z-index:3;display:inline-flex;align-items:center;border:1px solid var(--ln);border-radius:10px;overflow:hidden;background:#0c1426ee;backdrop-filter:blur(4px)}
.zc button{min-width:36px;height:34px;border:0;background:none;color:var(--tx);font:inherit;font-size:15px;cursor:pointer;padding:0 8px}
.zc button:hover{background:var(--bl)}
.zc #zl{min-width:58px;text-align:center;font-size:13px;color:var(--mu)}
.mdet{border-left:1px solid var(--ln);overflow:auto;padding:14px;background:var(--bg)}
.mmain svg{width:100%;height:auto;display:block}
.evg{cursor:pointer}
.evg:hover .al{stroke-width:3.2}
.evg.sel .hit{fill:#3b82f61a}
.legd{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mu);margin-bottom:10px}
.legd i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
@media(max-width:900px){.mbody{grid-template-columns:1fr}.mdet{border-left:0;border-top:1px solid var(--ln);max-height:38vh}}
@media(max-width:900px){.stu{grid-template-columns:1fr}}

.prov{display:flex;gap:10px;flex-wrap:wrap}
.pc{flex:1;min-width:170px;border:1px solid var(--ln);border-radius:10px;padding:10px 12px;background:var(--p2);cursor:pointer;text-align:left;color:var(--tx);font:inherit}
.pc:hover{border-color:var(--bl)}
.pc b{display:block}
.pc small{color:var(--mu);font-size:11px}
.pc.on{border-color:#22c55e66}
.pc .dot{color:var(--gr)}
.pc.add{border-style:dashed;color:var(--bl);text-align:center}
#pdlg{border:1px solid var(--ln);border-radius:14px;background:var(--p);color:var(--tx);padding:0;width:min(480px,92vw)}
#pdlg::backdrop{background:#05080fcc}
#pdlg form{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
#pdlg h3{margin:0 0 4px;font-size:16px}
#pdlg label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mu)}
#pdlg input{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:9px 10px;font:inherit;font-size:13px}
#pdlg input:focus{outline:2px solid var(--bl);outline-offset:-1px}
#pdlg input[readonly]{opacity:.65}
#pmsg{font-size:12.5px;min-height:18px}
#pmsg.ok{color:var(--gr)} #pmsg.er{color:var(--rd)} #pmsg.wk{color:var(--or)}
#pdlg .row{display:flex;gap:8px;flex-wrap:wrap}
#pdlg .btn.pr{flex:1}
#pimp{border-top:1px solid var(--ln);padding-top:10px;display:flex;flex-direction:column;gap:8px}
@keyframes fl{to{stroke-dashoffset:-24}}
@keyframes gl{50%{opacity:.45}}
.sec>svg{width:100%;height:70px;display:block}
@media(max-width:1100px){html,body{height:auto}.app{height:auto;min-height:100vh}.main{display:block}.cen{overflow:visible}.rt{border-left:0;border-top:1px solid var(--ln)}.row3{grid-template-columns:1fr}.kan{grid-template-columns:1fr}}
@media(max-width:760px){.app{grid-template-columns:1fr}.sb{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="app">
<nav class="sb">
  <div class="brand"><i>◆</i>AI Team</div>
  <div class="ws">● Claude Workspace</div>
  <h6>BUILD</h6>
  <button class="nv" data-v="design"><b>◇</b>ผังงาน</button>
  <button class="nv" data-v="studio"><b>▦</b>Team Builder</button>
  <button class="nv" data-v="jobs"><b>▤</b>งานที่แจก</button>
  <button class="nv" data-v="usage"><b>◔</b>การใช้ AI</button>
  <h6>GOVERN</h6>
  <button class="nv" data-r="eval"><b>✓</b>Boundary</button>
  <button class="nv" data-v="audit"><b>≡</b>Audit log</button>
  <h6>OBSERVE</h6>
  <button class="nv" data-s="mon"><b>∿</b>Monitoring</button>
  <button class="nv" data-r="hist"><b>↺</b>Traces</button>
</nav>
<div class="main">
  <div class="hd">
    <div class="crumb">AI Team › Command Center</div>
    <h1>Claude Command Center <span class="draft" id="live">Live</span></h1>
    <div class="sp"></div>
    <button class="btn" id="exp">Export log</button>
    <div class="tabsx" id="vt">
      <button class="tabx" data-v="design">Design</button><button class="tabx" data-v="studio">Studio</button><button class="tabx" data-v="jobs">Jobs</button><button class="tabx" data-v="usage">Usage</button><button class="tabx" data-v="audit">Audit</button>
    </div>
  </div>
  <div class="cen" id="cen"></div>
  <aside class="rt">
    <div class="rtabs" id="rt"><button data-r="insp">Inspector</button><button data-r="eval">Evaluations</button><button data-r="hist">History</button></div>
    <div class="rbody" id="rb"></div>
  </aside>
</div>
</div>
<dialog id="pdlg">
  <form method="dialog" id="pform" autocomplete="off" onsubmit="return false">
    <h3 id="ptitle">เพิ่มผู้ให้บริการ API</h3>
    <label>ชื่อในระบบ (a-z 0-9 . _ -)<input id="pname" maxlength="40"></label>
    <label>Base URL<input id="purl" placeholder="https://…/v1"></label>
    <label>API Key<input id="pkey" type="password" autocomplete="new-password" spellcheck="false" placeholder="วาง API key ที่นี่"></label>
    <div class="hint" style="margin:0">key ถูกส่งไปเก็บในฐานข้อมูลบนเครื่องคุณเท่านั้น (ไม่ส่งไปที่อื่นนอกจากเกตเวย์นี้) และจะไม่แสดงกลับมาอีก</div>
    <div id="pmsg"></div>
    <div class="row"><button type="button" class="btn pr" id="psave">บันทึกและทดสอบ</button><button type="button" class="btn" id="pdel" hidden>ลบผู้ให้บริการ</button><button type="button" class="btn" id="pclose">ปิด</button></div>
    <div id="pimp" hidden>
      <label>นำเข้าเฉพาะโมเดลที่ชื่อมีคำว่า (เว้นว่าง = ทั้งหมด)<input id="pfilter"></label>
      <button type="button" class="btn pr" id="pimport">นำเข้าโมเดลเข้าแคตตาล็อก</button>
    </div>
  </form>
</dialog>
<div id="modal" hidden>
  <div class="mbox">
    <div class="mh"><b>Flow Inspector</b>
      <div class="mtabs"><button data-mtab="seq">ลำดับการไหล</button><button data-mtab="net">ผังเครือข่าย</button></div>
      <div class="mjobs" id="mjobs"></div>
      <button class="mx" data-close="1" title="ปิด (Esc)">✕</button></div>
    <div class="mbody"><div class="mwrap"><div class="mmain" id="mmain"></div>
      <div class="zc" title="ซูม: ปุ่ม +/− หรือ Ctrl/⌘ + ล้อเมาส์/pinch · ลากเพื่อเลื่อน"><button data-zoom="-1" aria-label="ซูมออก">−</button><span id="zl">100%</span><button data-zoom="1" aria-label="ซูมเข้า">+</button><button data-zoom="reset" title="รีเซ็ต 100%" aria-label="รีเซ็ต">⟲</button><button data-zoom="fit" title="พอดีหน้าจอ" aria-label="พอดีหน้าจอ">⛶</button></div></div>
      <aside class="mdet" id="mdet"></aside></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COL={claude:'#f59e0b',worker:'#22d3ee',intern:'#c084fc'}, PAL=['#22d3ee','#c084fc','#3b82f6','#22c55e'];
const col=n=>COL[n]||PAL[Math.abs([...String(n)].reduce((a,c)=>a+c.charCodeAt(0),0))%4];

  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d} L${w} ${h} L0 ${h}Z" fill="${c}" opacity=".15"/><path d="${d}" fill="none" stroke="${c}" stroke-width="1.6"/></svg>`}

/* ซูม/แพน: ผังเครือข่าย (ทั้งในหน้า Design และใน Flow Inspector) ใช้ transform ใน SVG — กรอบคงที่ เนื้อหาย่อ/ขยาย
   ลำดับการไหล (ในหน้าต่างขยาย) ใช้ความกว้าง + เลื่อน */
const ZMIN=.3, ZMAX=4, clampZ=z=>Math.min(ZMAX,Math.max(ZMIN,z));
const CTX={
  m:{get z(){return mz},set z(v){mz=v},get x(){return mpx},set x(v){mpx=v},get y(){return mpy},set y(v){mpy=v},root:()=>$('mmain'),label:()=>$('zl')},
  i:{z:1,x:0,y:0,root:()=>document.querySelector('#cen .canvas'),label:()=>document.querySelector('#cen .zli')}
};
const isNet=c=>c!==CTX.m||mtab==='net';
function applyCtx(c){
  const r=c.root(), l=c.label(); if(l)l.textContent=Math.round(c.z*100)+'%';
  const g=r&&r.querySelector('.zg'); if(g&&isNet(c))g.setAttribute('transform',`translate(${495+c.x},${225+c.y}) scale(${c.z}) translate(-495,-225)`);
}
const applyNet=()=>applyCtx(CTX.m);
function netView(c,cx,cy){const svg=c.root()&&c.root().querySelector('svg'); if(!svg)return null;const b=svg.getBoundingClientRect(),s=Math.min(b.width/990,b.height/450)||1;
  return {s,pt:cx==null?[495,225]:[(cx-b.left-(b.width-990*s)/2)/s,(cy-b.top-(b.height-450*s)/2)/s]}}
function setZoom(z,cx,cy,c){
  c=c||CTX.m; z=clampZ(z); const k=z/c.z; if(k===1)return;
  if(isNet(c)){const v=netView(c,cx,cy); if(!v)return; c.x=(v.pt[0]-495)-k*(v.pt[0]-495-c.x); c.y=(v.pt[1]-225)-k*(v.pt[1]-225-c.y); c.z=z; applyCtx(c); return}
  const m=$('mmain'), bb=m.getBoundingClientRect(), ax=cx==null?m.clientWidth/2:cx-bb.left, ay=cy==null?m.clientHeight/2:cy-bb.top;
  const nx=(m.scrollLeft+ax)*k-ax, ny=(m.scrollTop+ay)*k-ay; mz=z; renderModal(); m.scrollLeft=nx; m.scrollTop=ny;
}
function zoomReset(c){c=c||CTX.m;c.z=1;c.x=0;c.y=0;if(c===CTX.m&&modal)renderModal();else applyCtx(c)}
function zoomFit(c){
  c=c||CTX.m;
  if(isNet(c)){const [x0,y0,x1,y1]=NBOX,bw=x1-x0,bh=y1-y0; c.z=clampZ(Math.min(990*.92/bw,450*.92/bh)); c.x=-c.z*((x0+x1)/2-495); c.y=-c.z*((y0+y1)/2-225); applyCtx(c)}
  else{zoomReset(c); $('mmain').scrollTop=0; $('mmain').scrollLeft=0}
}
document.addEventListener('wheel',e=>{
  if(!(e.ctrlKey||e.metaKey))return;
  if(modal){if(e.target.closest('#mmain')){e.preventDefault();setZoom(mz*Math.exp(-e.deltaY*.0025),e.clientX,e.clientY,CTX.m)}return}
  if(e.target.closest('#cen .canvas')){e.preventDefault();setZoom(CTX.i.z*Math.exp(-e.deltaY*.0025),e.clientX,e.clientY,CTX.i)}
},{passive:false});
let pan=null;
document.addEventListener('mousedown',e=>{

  if(!c)return;
  pan={c,el,x:e.clientX,y:e.clientY,l:el.scrollLeft,t:el.scrollTop,px:c.x,py:c.y,s:(isNet(c)&&netView(c)||{s:1}).s};el.classList.add('pan')});
window.addEventListener('mousemove',e=>{if(!pan)return;const dx=e.clientX-pan.x,dy=e.clientY-pan.y;
  if(isNet(pan.c)){pan.c.x=pan.px+dx/pan.s;pan.c.y=pan.py+dy/pan.s;applyCtx(pan.c)}else{pan.el.scrollLeft=pan.l-dx;pan.el.scrollTop=pan.t-dy}});
window.addEventListener('mouseup',()=>{if(pan)pan.el.classList.remove('pan');pan=null});

/* ---------- ผู้ให้บริการ API (เพิ่มเกตเวย์จากหน้าจอ) ---------- */
function provHtml(){
  const gws=S.gateways||[], byUrl=Object.fromEntries(gws.map(g=>[g.base_url.replace(/\/+$/,''),g]));
  const cards=(S.presets||[]).map(p=>{const g=byUrl[p.base_url];
    return `<button class="pc ${g?'on':''}" data-prov="${esc(p.id)}"><b>${g?'<span class="dot">●</span> ':''}${esc(p.title)}</b><small>${g?(g.has_key?'เชื่อมแล้ว · ':'ยังไม่มี key · ')+g.models+' โมเดลในแคตตาล็อก':'ยังไม่ได้เชื่อม · คลิกเพื่อเพิ่ม key'}</small></button>`}).join('');
  const known=new Set((S.presets||[]).map(p=>p.base_url));
  const others=gws.filter(g=>!known.has(g.base_url.replace(/\/+$/,''))).map(g=>`<button class="pc on" data-provgw="${esc(g.name)}"><b><span class="dot">●</span> ${esc(g.name)}</b><small>${esc(g.host)} · ${g.models} โมเดล</small></button>`).join('');
  return `<div class="card" style="margin-bottom:14px"><h3>Providers (ผู้ให้บริการ API)</h3><div class="prov">${cards}${others}<button class="pc add" data-prov="custom"><b>+ กำหนดเอง</b><small>URL แบบ OpenAI-compatible</small></button></div></div>`;
}
let PD={gw:null};
const $p=id=>document.getElementById(id);
function pmsg(t,k=''){const m=$p('pmsg');m.textContent=t;m.className=k}
function openProv(presetId,gwName){
  const gws=S.gateways||[]; let g=null,pr=null;
  if(gwName) g=gws.find(x=>x.name===gwName);
  else if(presetId&&presetId!=='custom'){pr=(S.presets||[]).find(x=>x.id===presetId); g=gws.find(x=>x.base_url.replace(/\/+$/,'')===pr.base_url)}
  PD={gw:g?g.name:null,preset:pr};
  $p('ptitle').textContent=g?`แก้ไข: ${g.name}`:(pr?`เชื่อม ${pr.title}`:'เพิ่มผู้ให้บริการกำหนดเอง');
  $p('pname').value=g?g.name:(pr?pr.name:''); $p('pname').readOnly=!!g;
  $p('purl').value=g?g.base_url:(pr?pr.base_url:''); $p('pkey').value='';
  $p('pkey').placeholder=g&&g.has_key?'เว้นว่าง = ใช้ key เดิม (หรือวาง key ใหม่เพื่อเปลี่ยน)':'วาง API key ที่นี่';
  $p('pfilter').value=pr?pr.filter:''; $p('pimp').hidden=true; $p('pdel').hidden=!g; pmsg('');
  $p('pdlg').showModal(); setTimeout(()=>$p('pkey').focus(),50);
}
async function apiRaw(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Dash':'1'},body:JSON.stringify(body)});return r.json()}
async function provSave(){
  const name=$p('pname').value.trim(), btn=$p('psave'); btn.disabled=true; pmsg('กำลังบันทึกและทดสอบ…','wk');
  try{
    let d=await apiRaw('/api/gateway',{name,base_url:$p('purl').value,api_key:$p('pkey').value}); if(d.error)throw new Error(d.error);
    $p('pkey').value=''; PD.gw=name; $p('pdel').hidden=false;
    d=await apiRaw('/api/gateway_test',{name}); if(d.error)throw new Error('บันทึกแล้ว แต่ทดสอบไม่ผ่าน: '+d.error);
    pmsg(`เชื่อมต่อสำเร็จ พบ ${d.models} โมเดลบนเกตเวย์นี้`,'ok'); $p('pimp').hidden=false; await tick(true);
  }catch(e){pmsg(e.message,'er')}finally{btn.disabled=false}
}
async function provImport(){
  const btn=$p('pimport'); btn.disabled=true; pmsg('กำลังนำเข้า…','wk');
  try{ const d=await apiRaw('/api/import',{name:PD.gw,grep:$p('pfilter').value}); if(d.error)throw new Error(d.error);
    pmsg(`นำเข้า ${d.added} โมเดลใหม่ (ตรงเงื่อนไข ${d.matched} จากทั้งหมด ${d.total}; ข้ามโมเดลเสียง/embedding/safety) — ไปกด "ทดสอบ" ที่โมเดลเพื่อตรวจว่าเรียกได้จริง`,'ok'); await tick(true);
  }catch(e){pmsg(e.message,'er')}finally{btn.disabled=false}
}
async function provDelete(){
  if(!PD.gw||!confirm(`ลบผู้ให้บริการ "${PD.gw}" และโมเดลของมันออกจากแคตตาล็อก?`))return;
  const d=await apiRaw('/api/gateway_delete',{name:PD.gw}); if(d.error)return pmsg(d.error,'er');
  $p('pdlg').close(); await tick(true);
}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-prov]'); if(a){openProv(a.dataset.prov);return}
  const b=e.target.closest('[data-provgw]'); if(b){openProv(null,b.dataset.provgw);return}
  if(e.target.id==='psave')provSave(); else if(e.target.id==='pimport')provImport(); else if(e.target.id==='pdel')provDelete(); else if(e.target.id==='pclose')$p('pdlg').close();
});
/* ---------- right panel ---------- */
function inspector(){
  const A=S.audit,id=selNode, ag=id.startsWith('a:')?S.agents.find(a=>a.name===id.slice(2)):null;
  if(ag){const rows=A.filter(a=>a.agent===ag.name),ok=rows.filter(a=>st(a)==='done'&&a.ms);
    return `<div class="sec"><h4>${esc(ag.title)} <span class="badge ${rows.some(pend)?'wk':'ok'}">${rows.some(pend)?'Working':'Ready'}</span></h4><dl class="kv"><dt>ชื่อ</dt><dd>${esc(ag.name)}</dd><dt>โมเดล</dt><dd>${esc(ag.model)}</dd><dt>Gateway</dt><dd>${esc(ag.host)}</dd><dt>บทบาท</dt><dd>${esc(ag.role)}</dd><dt>รับงาน</dt><dd>${rows.filter(a=>a.blocked==null).length} ครั้ง</dd><dt>ตอบเฉลี่ย</dt><dd>${ok.length?(ok.reduce((s,a)=>s+a.ms,0)/ok.length/1000).toFixed(1)+'s':'—'}</dd></dl></div>
    <div class="sec"><h4>งานล่าสุด</h4>${rows.slice(0,3).map(a=>`<div class="txt">${esc(a.brief.slice(0,200))}</div><div class="txt r">${esc(a.blocked||a.reply||'⏳ กำลังทำงาน…')}</div>`).join('')||'<div class="empty">ยังไม่มีงาน</div>'}</div>`}
  const info={trigger:['Trigger','คำสั่งที่ผู้ใช้ส่งมาในแชท จุดเริ่มของทุกงาน'],claude:['Claude (Head)','หัวหน้า: แตกงาน เขียน brief ส่งลูกทีม ตรวจผลและบันทึกผลตรวจ'],
   policy:['Policy Check','ด่าน boundary ก่อนส่งถึงลูกทีม: กรองข้อมูลลับ จำกัดความยาวและงบจำนวนครั้ง'],review:['Review','Claude ตรวจผลลัพธ์ทุกชิ้นก่อนรายงานผู้ใช้'],response:['Response','สรุปผลที่ตรวจแล้วส่งกลับผู้ใช้'],blocked:['Blocked','brief ที่ถูกบล็อกหรือการเรียกที่ผิดพลาด']}[id]||['',''];
  const extra=id==='claude'?S.notes.slice(0,3).map(n=>`<div class="txt r">${esc(n.text)}</div>`).join(''):id==='blocked'?A.filter(a=>a.blocked!=null).slice(0,4).map(a=>`<div class="txt">${esc(a.agent)}: ${esc(a.blocked)}</div>`).join(''):'';
  return `<div class="sec"><h4>${esc(info[0])}</h4><div class="empty" style="font-size:12.5px;color:var(--tx)">${esc(info[1])}</div>${extra}</div>`;
}
function evaluations(){
  const A=S.audit, ok=A.filter(a=>st(a)==='done'), er=A.filter(a=>st(a)==='err'), wk=A.filter(pend);
  const bl=A.filter(isBlk), forb=bl.filter(a=>a.blocked.includes('ต้องห้าม')).length, long=bl.filter(a=>a.blocked.includes('ยาว')).length;
  const hr=A.filter(a=>now()-a.t<3600&&a.blocked==null).length;
  const jobs=[...new Set(A.filter(a=>a.job).map(a=>a.job))], rev=jobs.filter(j=>S.notes.some(n=>n.job===j)).length;
  const gate=(t,good,note)=>`<div class="gate"><div class="ic ${good?'':'w'}">${good?'✓':'!'}</div><span>${t}</span><em>${esc(note)}</em></div>`;
  const ms=A.filter(a=>a.ms).slice(0,20).reverse().map(a=>a.ms);
  const tot=ok.length+er.length+wk.length||1, C=2*Math.PI*30, seg=(n,o)=>`${n/tot*C} ${C}`, offs=[0,ok.length/tot*C,(ok.length+wk.length)/tot*C];
  const ring=[[ok.length,'#3b82f6',offs[0]],[wk.length,'#f59e0b',offs[1]],[er.length,'#ef4444',offs[2]]].map(([n,c,o])=>n?`<circle cx="40" cy="40" r="30" fill="none" stroke="${c}" stroke-width="10" stroke-dasharray="${n/tot*C} ${C}" stroke-dashoffset="${-o}" transform="rotate(-90 40 40)"/>`:'').join('');
  return `<div class="sec"><h4>Release Gate <a>Boundary</a></h4>
    ${gate('ไม่มีข้อมูลลับใน brief',true,forb?`บล็อกแล้ว ${forb}`:'ไม่พบ')}
    ${gate('ความยาว brief ≤ 8,000',true,long?`บล็อกแล้ว ${long}`:'ปกติ')}
    ${gate('งบเรียก/ชั่วโมง',hr<25,`${hr}/30`)}
    ${gate('Claude ตรวจผลทุกงาน',jobs.length===rev,`${rev}/${jobs.length} งาน`)}
    ${gate('สายบังคับบัญชา Head→ลูกทีม',true,'บังคับใช้')}</div>
  <div class="sec"><h4>Evaluation Results <a>เวลาตอบ (ms)</a></h4>${spark(ms,'#3b82f6',290,70)}</div>
  <div class="sec"><h4>Task Status</h4><div class="tc"><svg width="80" height="80" viewBox="0 0 80 80"><circle cx="40" cy="40" r="30" fill="none" stroke="#ffffff10" stroke-width="10"/>${ring}</svg>
    <div class="leg"><span><i style="background:#3b82f6"></i>Passed ${ok.length}</span><span><i style="background:#f59e0b"></i>Working ${wk.length}</span><span><i style="background:#ef4444"></i>Failed ${er.length}</span></div></div></div>
  <div class="sec"><h4>Latest Traces <a data-r="hist" style="cursor:pointer">View all</a></h4>${traces(5)}</div>`;
}
function traces(n){const r=S.audit.slice(0,n);return r.map(a=>{const s=st(a);return `<div class="tr" data-t="${esc(a.agent)}"><span class="t">${esc(a.brief.slice(0,46))}</span><span class="badge ${s==='done'?'ok':s==='work'?'wk':'er'}">${s==='done'?'completed':s==='work'?'working':isBlk(a)?'blocked':'error'}</span><small>${ago(a.t)}</small></div>`}).join('')||'<div class="empty">ยังไม่มี trace</div>'}

function render(){
  document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  document.querySelectorAll('#rt [data-r]').forEach(b=>b.classList.toggle('on',b.dataset.r===rtab));
  const qn=S.queue||{}, qw=(qn.queued||0)+(qn.running||0), busy=S.audit.some(pend)||qw>0; $('live').textContent=qw?`Queue ${qn.running||0} กำลังทำ · ${qn.queued||0} รอ`:(busy?'Working':'Live'); $('live').classList.toggle('idle',!busy);
  $('cen').innerHTML=(view==='design'?flow()+bottom():view==='studio'?studioView():view==='jobs'?jobsView():view==='usage'?usageView():auditView());
  if(view==='design')applyCtx(CTX.i);
  $('rb').innerHTML=rtab==='insp'?inspector():rtab==='eval'?evaluations():`<div class="sec"><h4>All Traces</h4>${traces(60)}</div>`;
}
document.addEventListener('dragstart',e=>{const c=e.target.closest('[data-cat]');if(c){dragging=true;e.dataTransfer.setData('text/plain',c.dataset.cat)}});
document.addEventListener('dragend',()=>{dragging=false;document.querySelectorAll('.seat.over').forEach(x=>x.classList.remove('over'))});
document.addEventListener('dragover',e=>{const t=e.target.closest('[data-seat]');if(t){e.preventDefault();document.querySelectorAll('.seat.over').forEach(x=>x!==t&&x.classList.remove('over'));t.classList.add('over')}});
document.addEventListener('drop',e=>{const t=e.target.closest('[data-seat]');if(t){e.preventDefault();dragging=false;post('/api/seat',{seat:t.dataset.seat,catalog:e.dataTransfer.getData('text/plain')})}});
document.addEventListener('change',e=>{const s=e.target.closest('[data-pos]'); if(s)post('/api/position',{seat:s.dataset.pos,role:s.value||null})});
document.addEventListener('keydown',e=>{
  if(!modal)return;
  if(e.key==='Escape'){modal=false;renderModal()}
  else if(e.key==='+'||e.key==='='){setZoom(mz*1.25)}
  else if(e.key==='-'||e.key==='_'){setZoom(mz/1.25)}
  else if(e.key==='0'){zoomReset()}
  else if(e.key==='f'||e.key==='F'){zoomFit()}
});
document.addEventListener('click',e=>{
  const zi=e.target.closest('#cen [data-zoom]'); if(zi){const d=zi.dataset.zoom;d==='fit'?zoomFit(CTX.i):d==='reset'?zoomReset(CTX.i):setZoom(CTX.i.z*(d==='1'?1.25:1/1.25),null,null,CTX.i);return}
  if(e.target.closest('[data-expand]')){modal=true;mev=null;mz=1;mpx=0;mpy=0;renderModal();return}
  if(e.target.closest('#modal')){
    if(e.target.closest('[data-close]')||e.target.id==='modal'){modal=false;renderModal();return}
    const zm=e.target.closest('[data-zoom]'); if(zm){const d=zm.dataset.zoom;d==='fit'?zoomFit():d==='reset'?zoomReset():setZoom(d==='1'?mz*1.25:mz/1.25);return}
    const mt=e.target.closest('[data-mtab]'); if(mt){mtab=mt.dataset.mtab;mev=null;mz=1;mpx=0;mpy=0;renderModal();return}
    const mj=e.target.closest('[data-mjob]'); if(mj){mjob=mj.dataset.mjob;mev=null;renderModal();return}
    const eg=e.target.closest('[data-ev]'); if(eg){mev=+eg.dataset.ev;renderModal();return}
    const nd2=e.target.closest('[data-n]'); if(nd2){selNode=nd2.dataset.n;renderModal();return}
    return;
  }
  const tst=e.target.closest('[data-test]'); if(tst){tst.textContent='…';post('/api/test',{catalog:tst.dataset.test});return}
  const clr=e.target.closest('[data-clear]'); if(clr){post('/api/seat',{seat:clr.dataset.clear,catalog:null});return}
  if(e.target.closest('[data-undo]')){post('/api/undo',{});return}
  if(e.target.closest('[data-addseat]')){post('/api/seat_add',{});return}
  const nn=e.target.closest('[data-n]'); if(nn&&view==='studio'){post('/api/plan',{n:Math.max(1,S.plan.n+ +nn.dataset.n),mode:S.plan.mode});return}
  const md=e.target.closest('[data-mode]'); if(md){post('/api/plan',{n:S.plan.n,mode:md.dataset.mode});return}
  const ch=e.target.closest('[data-cat]'); if(ch){pick=pick===ch.dataset.cat?null:ch.dataset.cat;render();return}
  if(e.target.closest('select'))return;
  const sd=e.target.closest('[data-seat]'); if(sd&&pick){const p=pick;pick=null;post('/api/seat',{seat:sd.dataset.seat,catalog:p});return}
  const v=e.target.closest('[data-v]'); if(v){view=v.dataset.v;render();if(view==='usage')loadUsage();return}
  const r=e.target.closest('[data-r]'); if(r){rtab=r.dataset.r;render();return}
  if(e.target.closest('[data-s]')){view='design';render();$('mon')?.scrollIntoView({behavior:'smooth'});return}
  const nd=e.target.closest('[data-n]'); if(nd){selNode=nd.dataset.n;rtab='insp';render();return}
  const jt=e.target.closest('.jt'); if(jt){selJob=jt.dataset.k;render();return}
  const c=e.target.closest('.cd'); if(c){const id=+c.dataset.id;open.has(id)?open.delete(id):open.add(id);render();return}
  const t=e.target.closest('[data-t]'); if(t){selNode='a:'+t.dataset.t;rtab='insp';view='design';render()}
});
$('exp').onclick=()=>{const b=new Blob([JSON.stringify({audit:S.audit,notes:S.notes},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ai-team-log.json';a.click()};
async function tick(force){if(dragging)return;try{const n=await (await fetch('/api/state')).json(),j=JSON.stringify(n);const ch=j!==lastJ;if(force===true||ch||view==='design'){lastJ=j;S=n;render();if(modal&&(ch||force===true))renderModal()}}catch(e){}}
(()=>{const h=new URLSearchParams(location.hash.slice(1));if(h.get('view'))view=h.get('view');if(h.get('rtab'))rtab=h.get('rtab');if(h.get('job'))selJob=h.get('job');if(h.get('modal')){modal=true;mtab=h.get('modal')==='net'?'net':'seq';if(h.get('job'))mjob=h.get('job')}if(h.get('zoom'))mz=Math.min(4,Math.max(.4,+h.get('zoom')||1))})();
tick(); setInterval(tick,2000);
</script>
