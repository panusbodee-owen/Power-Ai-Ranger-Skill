<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Command Center</title>
<style>
:root{--bg:#0e1116;--panel:#161b22;--line:#2a3240;--text:#e6e9ef;--mute:#8b94a3;--bad:#f87171;--ok:#4ade80;--warn:#fbbf24;
--head:#e8a87c;--worker:#4ade80;--intern:#fbbf24;--other:#7c9cff}
@media (prefers-color-scheme:light){:root{--bg:#f4f5f8;--panel:#fff;--line:#dfe3ea;--text:#161a22;--mute:#667085;--bad:#dc2626;--ok:#16a34a;--warn:#b45309;
--head:#c2410c;--worker:#16a34a;--intern:#b45309;--other:#4263eb}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,"Noto Sans Thai",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;font-weight:650}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:p 2s infinite}
@keyframes p{50%{opacity:.35}}
main{max-width:1100px;margin:auto;padding:20px 24px;display:grid;gap:20px}
section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 14px;font-weight:600}
/* org */
.org{display:flex;flex-direction:column;align-items:center}
.lvl{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;width:100%}
.card{width:min(100%,290px);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:12px;padding:12px 14px;background:var(--bg);position:relative}
.card.busy{box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 45%,transparent);animation:g 1.4s infinite}
@keyframes g{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 15%,transparent)}}
.card b{color:var(--c);font-size:15px}
.card small{color:var(--mute);display:block;font-size:12px;word-break:break-all}
.st{margin-top:8px;font-size:12px;display:flex;justify-content:space-between;color:var(--mute)}
.st .on{color:var(--c);font-weight:600}
.arrows{display:flex;justify-content:center;gap:16px;width:100%;height:34px}
.arrow{width:min(100%,290px);display:flex;justify-content:center}
.arrow i{display:block;width:0;height:100%;border-left:2px dashed var(--line)}
.arrow.busy i{border-color:var(--c);animation:f .7s linear infinite}
@keyframes f{to{background-position:0 8px}}
.arrow.busy i{border-left-style:dashed}
/* jobs */
.job{border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.jh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600}
.jh small{color:var(--mute);font-weight:400}
.tag{font-size:11px;padding:1px 9px;border-radius:99px;font-weight:600;white-space:nowrap}
.tag.work{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.tag.done{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.tag.err{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
.ev{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.ev:first-of-type{border-top:0}
.who{font-size:13px;font-weight:600;color:var(--c)}
.who small{display:block;color:var(--mute);font-weight:400;font-size:11px}
.msg{white-space:pre-wrap;word-break:break-word;font-size:13px;color:var(--mute)}
.msg.reply{color:var(--text)}
.msg.bad{color:var(--bad)}
.lab{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.empty{color:var(--mute)}
@media(max-width:640px){.ev{grid-template-columns:1fr;gap:4px}}
</style>
</head>
<body>
<header><h1>AI Command Center</h1><span class="live"><span class="dot"></span>อัปเดตสด</span></header>
<main>
<section><h2>ผังการสั่งงาน</h2><div class="org" id="org"></div></section>
<section><h2>งานที่ Claude แจกจ่าย (ล่าสุดก่อน)</h2><div id="jobs" class="empty">กำลังโหลด…</div></section>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const col=n=>n==='worker'?'var(--worker)':n==='intern'?'var(--intern)':n==='claude'?'var(--head)':'var(--other)';
const hm=t=>new Date(t*1000).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
const pending=a=>a.reply==null&&a.blocked==null&&Date.now()/1000-a.t<300;
const isErr=a=>a.blocked!=null;
function render(S){
  const busy={}, cnt={};
  S.audit.forEach(a=>{cnt[a.agent]=(cnt[a.agent]||0)+(a.blocked==null?1:0); if(pending(a))busy[a.agent]=true});
  const anyBusy=Object.keys(busy).length>0;
  const head=`<div class="card ${anyBusy?'busy':''}" style="--c:var(--head)"><b>Claude (Head)</b><small>ผู้สั่งการ · คิด แตกงาน ตรวจผล</small>
    <div class="st"><span>${S.notes.length} บันทึกตรวจงาน</span><span class="${anyBusy?'on':''}">${anyBusy?'กำลังรอทีม…':'พร้อมสั่งงาน'}</span></div></div>`;
  const ag=S.agents.map(a=>`<div class="card ${busy[a.name]?'busy':''}" style="--c:${col(a.name)}"><b>${esc(a.title)} <span style="font-weight:400;color:var(--mute);font-size:12px">${esc(a.name)}</span></b>
    <small>${esc(a.model)}</small><div class="st"><span>รับงานแล้ว ${cnt[a.name]||0} ครั้ง</span><span class="${busy[a.name]?'on':''}">${busy[a.name]?'กำลังทำงาน…':'ว่าง'}</span></div></div>`).join('');
  const ar=S.agents.map(a=>`<div class="arrow ${busy[a.name]?'busy':''}" style="--c:${col(a.name)}"><i></i></div>`).join('');
  $('org').innerHTML=`<div class="lvl">${head}</div><div class="arrows">${ar}</div><div class="lvl">${ag}</div>`;
  // jobs
  const jobs={};
  S.audit.forEach(a=>{const k=a.job||'(ไม่ระบุชื่องาน)';(jobs[k]??={ev:[],last:0}).ev.push({k:'a',t:a.t,a});jobs[k].last=Math.max(jobs[k].last,a.t)});
  S.notes.forEach(n=>{const k=n.job||'(ไม่ระบุชื่องาน)';(jobs[k]??={ev:[],last:0}).ev.push({k:'n',t:n.t,n});jobs[k].last=Math.max(jobs[k].last,n.t)});
  const names=Object.keys(jobs).sort((x,y)=>jobs[y].last-jobs[x].last);
  if(!names.length){$('jobs').innerHTML='<span class="empty">ยังไม่มีงาน — สั่ง Claude ในแชทได้เลย งานจะปรากฏที่นี่</span>';return}
  $('jobs').innerHTML=names.map(k=>{
    const ev=jobs[k].ev.sort((x,y)=>x.t-y.t), as=ev.filter(e=>e.k==='a').map(e=>e.a);
    const tag=as.some(pending)?['work','กำลังทำ']:as.some(isErr)?['err','มีปัญหา']:['done','เสร็จ'];
    return `<div class="job"><div class="jh"><span>${esc(k)} <small>${as.length} งานย่อย · ${hm(jobs[k].last)}</small></span><span class="tag ${tag[0]}">${tag[1]}</span></div>`+
    ev.map(e=>{
      if(e.k==='n')return `<div class="ev"><div class="who" style="--c:var(--head)">Claude<small>ตรวจผล · ${hm(e.t)}</small></div><div class="msg reply">${esc(e.n.text)}</div></div>`;
      const a=e.a;
      return `<div class="ev"><div class="who" style="--c:${col(a.agent)}">Claude → ${esc(a.agent)}<small>${esc(a.model)} · ${hm(a.t)}</small></div>
      <div><div class="lab">brief</div><div class="msg">${esc(a.brief.slice(0,600))}</div>
      <div class="lab" style="margin-top:8px">${isErr(a)?'ผลลัพธ์':'คำตอบ'}</div>
      <div class="msg ${isErr(a)?'bad':'reply'}">${isErr(a)?esc(a.blocked):pending(a)?'⏳ กำลังทำงาน…':esc((a.reply||'').slice(0,1200))}</div></div></div>`}).join('')+`</div>`}).join('');
}
async function tick(){try{render(await (await fetch('/api/state')).json())}catch(e){}}
tick(); setInterval(tick,2000);
</script>
</body>
</html>
